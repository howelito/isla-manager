<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isla Manager</title><style>
:root{--bg:#0b0716;--panel:#150e2a;--panel2:#1d1438;--line:#3a2a66;--ink:#f2ecff;--dim:#a99bd0;--hi:#ffd23f;--acc:#ff3d8b;--teal:#2ee6c8;--good:#4be38a;--bad:#ff5a5a;--warn:#ffb347}
*{box-sizing:border-box}html,body{margin:0;overflow-x:clip}body{background:radial-gradient(1200px 500px at 80% -10%,#3a0f4d 0,transparent 60%),var(--bg);color:var(--ink);font:14px/1.45 Verdana,Geneva,Tahoma,sans-serif;min-height:100vh}
h1,h2,h3,.btn,.nav button,th,.tiles span{font-family:"Trebuchet MS","Arial Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em}
a{color:var(--teal);text-decoration:none}a:hover{text-decoration:underline}p{margin:8px 0}
.shell{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr}.shell.solo{max-width:760px;padding-top:8px}
.top{display:flex;align-items:center;gap:10px;padding:8px 10px;background:linear-gradient(90deg,#ff3d8b,#7a1fa2 60%,#2a1055);border-bottom:3px solid var(--hi);position:sticky;top:0;z-index:5}
.who{flex:1;min-width:0;display:flex;flex-direction:column}.who strong{font:700 17px "Trebuchet MS",sans-serif;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who span{font-size:11px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bank{display:flex;flex-direction:column;align-items:flex-end}.bank span{font-size:10px;text-transform:uppercase}.bank strong{font-size:15px}
.nav{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:#0a0618;border-bottom:1px solid var(--line)}
.nav button{flex:1 1 30%;background:var(--panel2);border:1px solid var(--line);color:var(--dim);padding:9px 4px;font-weight:700;font-size:12px;cursor:pointer}.nav button.on{background:var(--hi);color:#111;border-color:var(--hi)}.nav i{background:var(--acc);color:#fff;font-style:normal;border-radius:9px;padding:0 6px;font-size:11px}
main{padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);padding:10px;min-width:0}.panel h2{margin:0 0 8px;font-size:14px;color:var(--hi);border-bottom:1px solid var(--line);padding-bottom:5px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.btn{background:#2a1c52;color:var(--ink);border:1px solid #6a4fc0;padding:8px 12px;font-weight:700;font-size:12px;cursor:pointer;border-radius:2px}.btn:hover{background:#3a2870}.btn.go{background:var(--hi);color:#111;border-color:#fff3b0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tiles>div{background:var(--panel2);border:1px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;min-width:0}.tiles span{font-size:10px;color:var(--dim)}.tiles strong{font-size:24px;color:var(--hi)}.tiles strong.sm{font-size:15px}

.msg{background:#3a2c05;border:1px solid var(--warn);padding:8px 10px;margin:0}
.news{list-style:none;margin:0;padding:0}.news li{display:grid;grid-template-columns:78px 1fr;gap:0 8px;padding:6px 0;border-bottom:1px solid #2a1f4d}.news .when{grid-row:span 2;color:var(--dim);font-size:11px}
.card{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--acc);padding:8px 10px;margin:8px 0}.card h3{margin:0 0 4px;font-size:13px;color:var(--ink)}.card.choice{border-left-color:var(--hi)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.form label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--dim);text-transform:uppercase}
select,input{background:#0a0618;color:var(--ink);border:1px solid #6a4fc0;padding:8px;font:14px Verdana,sans-serif;width:100%;min-width:0}
.stp{display:inline-flex;align-items:center;gap:6px;margin:2px 6px 2px 0}.stp .btn{padding:4px 10px}.stp b{min-width:44px;text-align:center;color:var(--hi)}
.help{margin:0;padding-left:18px}.help li{margin:4px 0}

.start{max-width:720px;margin:0 auto;padding:24px 14px;display:flex;flex-direction:column;gap:12px}.start h1{margin:0;font-size:40px;color:var(--hi);text-shadow:3px 3px 0 var(--acc)}.sub{font-size:16px;color:var(--teal);margin:0}

  news(G,d.n+' signs for '+G.me.name,(from!=='FA'?'Released from '+clubName(G,from)+' for '+money(bo)+'. ':'')+money(fee)+' a night until the end of '+d.until+'.'); G.me.buzz=Math.min(30,G.me.buzz+d.draw/4); return ''; }

 a:function(G){ ask(G,"El Halcón is bringing the family","“Saturday. My sister, my mother, forty cousins. They want to see the boy headline.” DJ Sobrino has been practising one transition all week. He has not yet landed it.",[
   O("nephew","Give him the headline slot",{p:0.3,win:{fam:{hal:18},buzz:8,fn:"sobUp",t:"DJ Sobrino brings the house down",msg:"Nobody can explain it. He played the same record three times and the room went wild each time. The clip has two million views."},lose:{fam:{hal:10},rep:-1.5,buzz:-4,t:"A long night",msg:"Forty cousins danced. Nobody else did. El Halcón wept with pride and has not seen the reviews."}}),
   O("nephew","Warm-up slot, and call it the prestige set",{p:0.6,win:{fam:{hal:6},t:"The family are satisfied",msg:"“The connoisseur's hour,” you called it. Grandmother nodded."},lose:{fam:{hal:-12},t:"Grandmother was not fooled",msg:"“My grandson plays to an empty room at eleven o'clock?” El Halcón had to drive her home."}}),
   O("nephew","Buy time: secret lessons with Nonna Disco (€8,000)",{c:8000,lk:"djs",to:"b",inw:2})]); },
 b:function(G){ applyFx(G,{fam:{hal:20},buzz:5,fn:"sobUp",t:"The nephew can actually play",msg:"Three weeks in Nonna Disco's kitchen with two turntables and a wooden spoon. DJ Sobrino headlines for the family and lands every mix. El Halcón kisses you on both cheeks."}); arcGo(G,"nephew"); } }},
expose:{t:"The Colom investigation",p:0.2,cd:40,wk:4,can:function(G){ return true; },s:{
 a:function(G){ var dirty=G.wash||G.deal||G.prot; ask(G,"A journalist is asking questions","Marta Colom of the Diario de la Isla is writing about “new money in the nightlife”. She would like your accounts, an interview and a look at the cellar.",[
   O("expose","Open the books and give the tour",{p:dirty?0.4:0.95,win:{rep:1.5,buzz:3,ppl:{colom:10},t:"A glowing profile",msg:"“The island's most exciting new room.” It is on every hotel reception desk by Friday."},lose:{heat:10,ppl:{colom:-5},t:"She noticed something",msg:"Your bar takings are a little too good for your door count. She smiles, closes her notebook and says she will be in touch.",to:"b",inw:2}}),
   O("expose","No comment",{ppl:{colom:-3},to:"b",inw:2}),
   O("expose","Have the Firm discourage her",{p:0.45,win:{fam:{firm:5},ppl:{colom:-15},t:"The story goes away",msg:"Her editor moves her to the gardening pages. For now."},lose:{heat:20,rep:-3,ppl:{colom:-25},t:"Intimidation backfires",msg:"She publishes everything, including the photograph of the man who followed her home."}})]); },
 b:function(G){ ask(G,"Colom has a source","Marta Colom calls. She has a former employee on the record and a headline ready: “Who really owns "+G.me.name+"?” She is offering you the right of reply before Sunday's edition.",[
   O("expose","Give her a better story: Rafa Montiel's fire exits",{p:0.7,win:{ppl:{colom:8,montiel:-15},tbl:{VOL:-6},flag:{sab_VOL:1},inc:{volcan:1},t:"“Death trap”: Club Volcán on the front page",msg:"Your story is spiked. Montiel's chained fire doors are not. He knows exactly who tipped her off."},lose:{heat:12,rep:-1.5,t:"She ran both stories",msg:"Two pages on Volcán. Three on you."}}),
   O("expose","Send Señora Ribas (€30,000)",{c:30000,lk:"legal",p:0.6,win:{ppl:{ribas:5},t:"The Diario prints a clarification",msg:"Forty words on page 23. Señora Ribas has it framed."},lose:{heat:10,rep:-2,t:"“Club owner tries to gag the press”",msg:"The injunction fails and becomes the story."}}),
   O("expose","Sit down and answer everything",{p:(G.wash||G.deal)?0.25:0.85,win:{rep:2,ppl:{colom:12},t:"The right of reply",msg:"She prints your answers in full. Readers rather like you."},lose:{heat:22,rep:-2,conf:-8,t:"On the record",msg:"It reads badly. Your backers have the article pinned to their fridge."}})]); } }},
tiburon:{t:"El Tiburón",p:0.22,cd:35,wk:5,can:function(G){ return true; },boost:function(G){ return G.flags.volcan?0.3:0; },s:{
 a:function(G){ ask(G,"Rafa Montiel is saying things","The owner of Club Volcán has told three agents and a taxi rank that your kitchen gave half a hen party food poisoning. You do not have a kitchen.",[
   O("tiburon","Challenge him: a battle of the clubs, for the hospital charity",{ppl:{montiel:-3},to:"b",inw:1}),
   O("tiburon","Hire away his head promoter (€10,000)",{c:10000,lk:"marketing",p:0.65,win:{buzz:5,tbl:{VOL:-5},ppl:{montiel:-10},inc:{volcan:1},t:"Volcán's promoter changes shirts",msg:"She brings her phone, her street team and Montiel's entire guest list.",to:"c",inw:3},lose:{ppl:{montiel:-6},buzz:-2,t:"She took the money to Rafa",msg:"He matched it, kept her, and is telling everyone you are desperate.",to:"c",inw:3}}),
   O("tiburon","Let him talk",{buzz:-3,rep:0.3,to:"c",inw:4})]); },
 b:function(G){ var pv=clamp(0.5+(G.me.rep-(G.tbl.VOL?G.tbl.VOL.rep:40))/60,0.2,0.85); ask(G,"Battle of the clubs","Same night, same charity, two rooms: yours and Club Volcán. The island will count heads at 3am and the Diario will print the result. How do you want to play it?",[
   O("tiburon","Spend big on the night (€25,000)",{c:25000,lk:"marketing",p:clamp(pv+0.2,0,0.92),win:WINB,lose:LOSEB}),
   O("tiburon","Play it straight",{p:pv,win:WINB,lose:LOSEB}),
   O("tiburon","Have his generator looked at",{p:0.6,win:{buzz:6,rep:0.5,heat:5,tbl:{VOL:-6},ppl:{montiel:-20},t:"Volcán goes dark at 1am",msg:"Two thousand people walk up the road to yours. Montiel is seen kicking his own generator.",to:"c",inw:3},lose:{heat:16,rep:-2,flag:{sabotage:1},t:"Caught on camera",msg:"Your man was filmed with the bolt cutters. The charity returns your donation.",to:"c",inw:3}})]); },
 c:function(G){ ask(G,"Montiel is in trouble","Club Volcán has missed two rent payments and Rafa Montiel is in your office in yesterday's shirt. He needs €80,000 by Friday or Los Halcones take the club. It is costing him a great deal to ask you.",[
   O("tiburon","Lend him the money at your own rates",{c:80000,lk:"other",p:0.7,win:{flag:{montielDebt:8},ppl:{montiel:15},t:"Montiel owes you",msg:"He will repay €15,000 a week for eight weeks, and has stopped mentioning your kitchen."},lose:{ppl:{montiel:-5},tbl:{VOL:-15},t:"Montiel has left the island",msg:"With your €80,000 and somebody else's boat."}}),
   O("tiburon","Buy his sound system instead (€60,000)",{c:60000,lk:"building",fn:"soundUp",tbl:{VOL:-10},ppl:{montiel:-5},t:"Volcán sells the stacks",msg:"His rig is in your room by Thursday: one level better than yours was, and it still smells of his smoke machine."}),
   O("tiburon","Let the shark sink",{tbl:{VOL:-12},fam:{hal:3},ppl:{montiel:-20},t:"Los Halcones take Club Volcán",msg:"Montiel still stands on the door. He no longer owns it."})]); } }},
show:{t:"Valentina's show",p:0.25,cd:40,wk:3,can:function(G){ return G.me.dancers>=4&&G.ppl.cruz>-20; },s:{
 a:function(G){ ask(G,"Valentina has an idea","Your dance captain, Valentina Cruz, puts a folder on your desk: “Sirenas”. Aerial hoops, a water tank, twelve costume changes. “Three weeks of rehearsal and €18,000. Or we keep doing podiums like everyone else.”",[
   O("show","Fund it (€18,000)",{c:18000,lk:"staff",ppl:{cruz:8},to:"b",inw:2}),
   O("show","Half the budget, half the tank (€9,000)",{c:9000,lk:"staff",ppl:{cruz:2},flag:{cheapShow:1},to:"b",inw:2}),
   O("show","Podiums are fine",{ppl:{cruz:-8},to:"c",inw:3})]); },
 b:function(G,R){ var ch=G.flags.cheapShow; G.flags.cheapShow=0;
   if(R()<(ch?0.45:0.8)) applyFx(G,{fn:"dqUp",buzz:7,rep:1,ppl:{cruz:5},t:"“Sirenas” opens",msg:"The tank holds. The hoops hold. The room does not breathe for six minutes. Your troupe moves up a standard and the whole island wants to know who choreographed it."});
   else applyFx(G,{buzz:-2,ppl:{cruz:-4},t:"“Sirenas” springs a leak",msg:"The tank cracked during the second number and the front row got the full Mediterranean experience. Valentina blames the budget."});
   arcGo(G,"show","c",3); },
 c:function(G){ ask(G,"Donatella Ferrante wants your captain","La Sirena Negra has offered Valentina Cruz double her money and her name on the posters. She has not said yes. She has not said no either.",[
   O("show","Match it (€15,000)",{c:15000,lk:"staff",ppl:{cruz:10,ferrante:-5},t:"Valentina stays",msg:"With a pay rise, a dressing room and a look that says you left it late."}),
   O("show","Make her creative director, no extra money",{p:clamp(0.45+G.ppl.cruz/40,0.1,0.9),win:{ppl:{cruz:6},t:"Valentina stays",msg:"The title is on her door by the evening."},lose:{fn:"cruzGone",ppl:{ferrante:-10},t:"Valentina walks",msg:"She takes four dancers and her choreography to La Sirena Negra."}}),
   O("show","Wish her well",{fn:"cruzGone",t:"Valentina leaves for La Sirena Negra",msg:"Four of the troupe go with her."})]); } }},
mari:{t:"Inspector Marí",p:0.25,cd:30,wk:3,can:function(G){ return G.heat>=15; },s:{
 a:function(G){ ask(G,"The Inspector takes a coffee","Inspector Marí is at your bar at eleven in the morning, out of uniform. “My daughter Aina is eighteen next month. She wants her party here. I told her I would ask. I am asking.”",[
   O("mari","Host it, on the house (€6,000)",{c:6000,lk:"other",ppl:{mari:12},heat:-8,to:"b",inw:3,t:"Aina Marí turns eighteen",msg:"Sixty teenagers, one very large cake, and the Inspector dancing badly beside the fire exit he once fined you for."}),
   O("mari","Host it, and make sure there are photographs",{c:6000,lk:"other",ppl:{mari:6},flag:{kompro:1},heat:-4,to:"b",inw:3,t:"Aina Marí turns eighteen",msg:"A lovely party. Your photographer caught the Inspector accepting a magnum from Uncle Ray's accountant. Just in case."}),
   O("mari","Politely decline",{ppl:{mari:-6},t:"The Inspector finishes his coffee",msg:"“Of course. You are busy.” He leaves exact change."})]); },
 b:function(G){ ask(G,"A quiet word","Inspector Marí calls from a phone box. “I am not telling you anything. But if I ran a club, Thursday would be a good night for the cellar to be tidy and the toilets to be empty.”",[
   O("mari","Clean house for the week",{heat:-18,cash:-(Math.round(((G.wash||0)*0.12+(G.deal||0))/100)*100),ck:"underworld",fam:{firm:G.deal?-4:0,hal:G.wash?-3:0},ppl:{mari:4},t:"The raid finds nothing",msg:"Forty officers, two dogs and a very clean cellar. The families grumble about the lost week."}),
   O("mari","Carry on as normal",{p:(G.wash||G.deal)?0.25:0.8,win:{t:"Thursday passes",msg:"Either he was bluffing or somebody changed the rota."},lose:{heat:22,strike:1,close:1,ppl:{mari:-8},t:"RAID",msg:"He did warn you. The dogs find everything. Closed for a week, and a strike on the file."}}),
   G.flags.kompro?O("mari","Remind him about the photographs",{p:0.5,win:{heat:-30,ppl:{mari:-30},flag:{kompro:0},t:"The Inspector looks elsewhere",msg:"He says nothing for a long time. Then: “This is the last conversation we have as friends.” Your file goes to the bottom of a deep drawer."},lose:{heat:25,strike:1,ppl:{mari:-40},flag:{kompro:0},t:"Marí does not blink",msg:"“Publish them.” He adds attempted blackmail to the file himself."}}):O("mari","Thank him and send a case of wine",{ppl:{mari:3},heat:-6,t:"A case of Rioja",msg:"Delivered to the station with no card. The cellar gets a tidy anyway."})]); } }},
mayans:{t:"A silent partner",p:0.3,once:true,wk:4,can:function(G){ return G.bank<80000||G.loans.length>0; },s:{
 a:function(G){ ask(G,"Señor Mayans has a proposal","“Loans are so impersonal.” Señor Mayans will put €250,000 into "+G.me.name+" tonight for a silent share. He takes €7,000 a week, for ever, and says you will hardly know he is there.",[
   O("mayans","Take the money",{cash:250000,ck:"loans",flag:{mayans:1},ppl:{mayans:10},to:"b",inw:3,t:"You have a partner",msg:"€250,000 in a holdall. Señor Mayans has asked for a key to the office."}),
   O("mayans","Decline",{ppl:{mayans:-4}})]); },
 b:function(G){ ask(G,"The partner has a cousin","Señor Mayans' cousin Bernat needs a job. Señor Mayans feels the door would suit him. Bernat is six foot five, has never smiled, and thinks the guest list is “a suggestion”.",[
   O("mayans","Put Bernat on the door",{fn:"doorDown",ppl:{mayans:6},to:"c",inw:4,t:"Bernat starts on the door",msg:"Your door host has asked to be moved inside. The welcome is worse. Fights are, admittedly, down."}),
   O("mayans","Pay Bernat to stay at home (€20,000 for the season)",{c:20000,lk:"staff",to:"c",inw:4}),
   O("mayans","Refuse",{ppl:{mayans:-12},buzz:-2,to:"c",inw:3,t:"Señor Mayans is disappointed",msg:"Your office has been rearranged overnight. Nothing is missing. Everything is two inches to the left."})]); },
 c:function(G){ ask(G,"Buying back your club","Señor Mayans is prepared to sell you his share. The price is €400,000. “I am a sentimental man. For anyone else it would be five.”",[
   O("mayans","Buy him out (€400,000)",{c:400000,lk:"loans",flag:{mayans:0},ppl:{mayans:5},t:"The club is yours again",msg:"He returns the office key in a gift box. You change the locks anyway."}),
   O("mayans","Ask Los Halcones to renegotiate for you",{p:G.fam.hal>=10?0.7:0.25,win:{c:200000,lk:"loans",flag:{mayans:0},owe:{hal:1},t:"A family discount",msg:"El Halcón had a word. The price was halved, and the favour is now owed to somebody more dangerous."},lose:{ppl:{mayans:-20},c:30000,lk:"repairs",t:"Mayans takes offence",msg:"“You sent smugglers to my house?” The weekly cut stays. Your car does not."}}),
   O("mayans","Keep the partner",{})]); } }},
yacht:{t:"The man with the yacht",p:0.2,cd:44,wk:6,can:function(G){ return G.me.rep>=28; },s:{
 a:function(G){ ask(G,"An invitation from the Leviathan","Max Brandt, founder of something called BrandtCoin, has moored ninety metres of yacht off Talamanca. He wants your sound system, your dancers and your best bottles on deck for a private after-party. Tonight.",[
   O("yacht","Do it (he pays €40,000)",{p:0.78,win:{cash:40000,ck:"vip",buzz:3,to:"b",inw:2,t:"Sunrise on the Leviathan",msg:"He paid in full, tipped the dancers in watches and fell asleep in the hot tub."},lose:{cash:40000,ck:"vip",heat:12,to:"b",inw:2,t:"The coastguard come aboard",msg:"Noise, no permit, and a guest list the Guardia Civil found very interesting. He still paid."}}),
   O("yacht","Quote him double",{p:0.5,win:{cash:80000,ck:"vip",to:"b",inw:2,t:"“Whatever”",msg:"He did not look up from his phone. €80,000."},lose:{tbl:{MED:3},t:"Brandt goes elsewhere",msg:"Medusa Bay did it for thirty. Viktor Dragan now has a friend with a yacht."}}),
   O("yacht","Not your kind of business",{})]); },
 b:function(G){ ask(G,"Presented by BrandtCoin","Max Brandt loved it. He wants his name on your club for the rest of the season: "+G.me.name+", presented by BrandtCoin. €300,000 up front. Your marketing manager has gone pale.",[
   O("yacht","Take the money",{cash:300000,ck:"sponsors",rep:-2,to:"c",inw:4,t:G.me.name+", presented by BrandtCoin",msg:"The logo is nine metres wide and glows. The purists are appalled. The accountant is not."}),
   O("yacht","€120,000, no logo, and he gets the best table all season",{cash:120000,ck:"vip",t:"A private arrangement",msg:"Brandt has the best table every Saturday. Nobody has to look at his logo."}),
   O("yacht","Decline",{rep:0.5,conf:-3,t:"Not for sale",msg:"The island approves. Your backers ask you to repeat the figure slowly."})]); },
 c:function(G,R){ if(R()<0.6) applyFx(G,{buzz:-6,rep:-1.5,heat:6,t:"BrandtCoin collapses",msg:"Down 97% by lunchtime. The Leviathan left in the night. His nine-metre logo is still on your wall and there are camera crews outside it."}); else applyFx(G,{buzz:2,t:"BrandtCoin, improbably, is fine",msg:"The logo stays. Nobody understands what it does. Nobody asks."}); arcGo(G,"yacht"); } }},
safe:{t:"The empty safe",p:0.3,cd:50,wk:10,can:function(G){ return (G.led.door||0)>300000; },s:{
 a:function(G,R,A){ var c=Math.round(clamp(G.me.cap*45,30000,160000)/1000)*1000; led(G,"other",-c); A.d.c=c; ask(G,"The safe is empty","Saturday's takings, "+money(c)+", were in the office safe at 7am. At 9am they were not. No forced lock, no alarm. Somebody had the code.",[
   O("safe","Call Inspector Marí",{p:(G.wash||G.deal)?0.3:0.6,win:{ppl:{mari:5},cash:Math.round(c*0.4),ck:"other",to:"b",inw:1,t:"The police recover some of it",msg:"Found in a locker at the ferry port, along with a name."},lose:{heat:8,to:"b",inw:1,t:"The police take an interest in your safe",msg:"They did not find the money. They did find the second set of books."}}),
   G.prot?O("safe","Ask Los Halcones. This is what protection is for.",{owe:{hal:1},cash:c,ck:"other",to:"b",inw:0,t:"The money comes home",msg:"In a fish crate, every note, slightly damp. El Halcón sends his regards, a name, and a reminder that you owe him one."}):O("safe","Put the word out with both families",{fam:{hal:2,firm:2},p:0.5,win:{cash:Math.round(c/2),ck:"other",to:"b",inw:1,t:"Half of it comes back",msg:"In a carrier bag on your doorstep, with a name written on a receipt."},lose:{to:"b",inw:1}}),
   O("safe","Have Goran go through the staff",{to:"b",inw:1})]); },
 b:function(G){ ask(G,"The inside man","It was Dutch, your Thursday door host. He has been on Viktor Dragan's payroll since June, passing Medusa Bay your guest list, your bookings and, last week, your safe code.",[
   O("safe","Turn him: he works for you now",{p:0.6,win:{flag:{spyMED:6},ppl:{dragan:-5},t:"Dutch changes sides",msg:"Every Monday for six weeks he brings you Medusa Bay's bookings and bar prices. Dragan thinks he is still his."},lose:{ppl:{dragan:-10},buzz:-2,t:"Dutch tells Dragan everything",msg:"Including that you tried. Medusa Bay undercut your door price all week."}}),
   O("safe","Send Dragan a message (€5,000)",{p:0.65,c:5000,win:{tbl:{MED:-6},flag:{sab_MED:1},ppl:{dragan:-15},t:"Medusa Bay has a bad weekend",msg:"Their beer delivery went to Formentera and every cloakroom ticket was printed with the same number."},lose:{heat:12,ppl:{dragan:-15},t:"Dragan was expecting it",msg:"He had cameras on the loading bay. The footage is with his lawyer."}}),
   O("safe","Sack Dutch and change the code",{t:"Dutch is gone",msg:"He walks straight across the road and into a job at Medusa Bay."})]); } }},
favour:{t:"A favour is owed",p:0.45,cd:5,wk:2,can:function(G){ return G.owe.hal>0||G.owe.firm>0; },s:{
 a:function(G,R){ var k=G.owe.hal>0?"hal":"firm", f=FAM[k]; G.owe[k]--; var jobs=k==="hal"?[
    ["“My associate needs somewhere to stay. A week. He does not go out.” There is a man in your staff flat with a holdall and no surname.","Give him the flat","A quiet guest"],
    [G.me.ven.boat?"Los Halcones would like to borrow your party boat on Tuesday night. “Fishing.” They will return it clean.":"Los Halcones would like to borrow your delivery van on Tuesday night. They will return it clean.","Hand over the keys","Night fishing"]]:[
    ["Uncle Ray's daughter is getting married. He wants the club, closed to the public, on a Monday in peak season. “Family rate,” he says, meaning free.","Host the wedding","The wedding of the year"],
    ["A friend of the Firm needs €60,000 turned into a consultancy invoice from "+G.me.name+". Just the once.","Sign the invoice","Creative accounting"]];
   var j=pick(R,jobs); ask(G,f.n+" call in the favour",j[0],[
    O("favour",j[1],{p:0.75,win:{fam:mk(k,8),heat:5,t:j[2],msg:"It went smoothly. "+f.boss+" considers the account settled, and you a friend."},lose:{fam:mk(k,6),heat:18,t:j[2]+", with complications",msg:"It did not go smoothly. Inspector Marí has asked why your name is on the paperwork."}}),
    O("favour","Buy your way out (€25,000)",{c:25000,fam:mk(k,-3),t:"Favour settled in cash",msg:f.boss+" takes the envelope. “It is not the same,” he says."}),
    O("favour","Refuse",{fam:mk(k,-22),t:"You refused "+f.n,msg:"Nobody refuses a favour. "+f.boss+" is deciding what to do about it."})]); } }},
prodigy:{t:"The kid from the beach bar",p:0.2,cd:30,wk:3,can:function(G){ return true; },s:{
 a:function(G,R,A){ var d=prospect(G,R,SCENES[9]); d.pa=17+Math.floor(R()*3); d.pab=Math.max(d.pab||0,17); d.draw=Math.max(d.draw,5); d.known=true; d.tr=""; G.seen[d.id]=d.pa; A.d.id=d.id;
   ask(G,"Have you heard this kid?","Your sound engineer plays you a phone recording from a beach bar in Cala Llonga. The DJ is "+d.n+", "+d.age+", playing "+GENRES[d.g].toLowerCase()+" to forty people as if it were four thousand. Tommy Kessler of Neon Cathedral was seen in the same bar last night.",[
    O("prodigy","Sign "+d.n+" tonight: three seasons, €900 a night",{fn:"signKid",id:d.id,t:d.n+" signs for "+G.me.name,msg:"Three seasons at €900 a night, signed on a napkin. Kessler arrived twenty minutes later.",to:"b",inw:4}),
    O("prodigy","Offer a trial warm-up first",{p:0.5,win:{fn:"signKid",id:d.id,t:d.n+" signs after a trial",msg:"One warm-up set and the room was full by midnight. Signed for three seasons at €900 a night.",to:"b",inw:4},lose:{fn:"kidLost",id:d.id,ppl:{kessler:-3},t:d.n+" signs for Neon Cathedral",msg:"While you were arranging a trial, Tommy Kessler arrived with a contract and a car."}}),
    O("prodigy","Leave it. Every beach bar has one.",{fn:"kidLost",id:d.id,t:d.n+" signs for Neon Cathedral",msg:"Tommy Kessler does not leave it."})]); },
 b:function(G,R,A){ var d=G.djs[A.d.id]; if(!d||d.club!=="ME"){ arcGo(G,"prodigy"); return; } d.draw=Math.min(d.pa,d.draw+3);
   ask(G,d.n+" has a manager now","A man in loafers and no socks introduces himself as "+d.n+"'s new manager. The napkin contract, he says, “would not survive a breeze”. He wants €3,000 a night or a release.",[
    O("prodigy","Pay it",{fn:"kidWage",id:d.id,v:3000,t:d.n+" gets a new deal",msg:"€3,000 a night. Still the best value on your roster."}),
    O("prodigy","Stand on the napkin (Señora Ribas, €10,000)",{c:10000,lk:"legal",p:0.55,win:{ppl:{ribas:3},t:"The napkin holds",msg:"Señora Ribas enters it as evidence. The contract stands."},lose:{fn:"kidWage",id:d.id,v:3500,t:"The napkin does not hold",msg:"The judge laughed. €3,500 a night, plus costs."}}),
    O("prodigy","Sell the contract to Kessler (€120,000)",{cash:120000,ck:"buyouts",fn:"kidLost",id:d.id,ppl:{kessler:5},t:d.n+" sold to Neon Cathedral",msg:"A tidy profit on a napkin."})]); } }}
};

  if(G.week===1&&!E.mine(G).length) h+=panel('First steps','<ol class="help"><li>Go to <b>DJ market</b> and sign two or three residents you can afford.</li><li>Go to <b>Nights</b>, press Auto-pick and set your door prices.</li><li>Press <b>Continue</b> to open the doors.</li></ol>');
  if(G.inbox.length) h+=panel('Decisions waiting',G.inbox.map(function(m){ return '<div class="card"><h3>'+esc(m.t)+'</h3><p>'+esc(m.b)+'</p><p class="row">'+m.opts.map(function(o,i){ return btn(esc(o.l),'dec','data-id="'+m.id+'" data-i="'+i+'"',i===0?'':''); }).join('')+'</p></div>'; }).join(''));
  if(G.last&&G.last.length) h+=panel('Last week',tbl([['Night'],['Headliner'],['Crowd','n'],['Rating','n'],['Profit','n']],G.last.map(function(l){ return '<tr><td>'+esc(l.nm)+'</td><td>'+(l.h!=null?esc(G.djs[l.h].n):'-')+'</td><td class="n">'+l.att.toLocaleString()+'</td><td class="n hi">'+l.rating.toFixed(1)+'</td><td class="n '+(l.profit<0?'bad':'good')+'">'+E.money(l.profit)+'</td></tr>'; })));
  return h+storyPanel()+panel('News','<ul class="news">'+G.news.slice(0,30).map(function(n){ return '<li><span class="when">Wk '+n.w+', '+n.y+'</span><strong>'+esc(n.t)+'</strong><span>'+esc(n.b)+'</span></li>'; }).join('')+'</ul>'); };

S.nights=function(){ var pool=G.djs.filter(function(d){ return E.usable(G,d); }).sort(function(a,b){ return b.draw-a.draw; }), prob=E.lineProblems(G);
  var opts=[['','(nobody)']].concat(pool.map(function(d){ return [d.id,d.n+' ('+E.GENRES[d.g]+', draw '+d.draw+')']; }));
  var h=(prob.length?'<p class="msg">'+prob.map(esc).join(' ')+'</p>':'')+'<p class="row">'+btn('Auto-pick line-ups','auto')+btn('Add a weekly night ('+E.money(30000*G.nights.length)+')','addnight')+'</p>';
  if(!pool.length) h+='<p class="warn">You have no DJs this week. Sign a resident or book a one-off in the DJ market.</p>';
  G.nights.forEach(function(nt,i){ var fc=E.forecast(G,nt), fair=E.fairPrice(G,nt), cap=G.me.cap;
    h+=panel(esc(nt.nm)+(nt.main?' <i class="tag">main night: played live</i>':''),'<div class="form"><label>Warm-up'+sel('l_'+i+'_0',opts,nt.l[0]==null?'':nt.l[0],'line')+'</label><label>Headliner'+sel('l_'+i+'_1',opts,nt.l[1]==null?'':nt.l[1],'line')+'</label><label>Closing set'+sel('l_'+i+'_2',opts,nt.l[2]==null?'':nt.l[2],'line')+'</label></div>'+
      '<p>Door price '+stepper(nt.price,'price',i,function(v){ return '€'+v; })+' <span class="dim">A fair price for this bill is about €'+fair+'.</span></p><p>DJ fees for this night: <b>'+E.money(nt.l.reduce(function(a,x){ return a+(x==null?0:(G.djs[x].club==='ME'?G.djs[x].wage:((G.books.filter(function(b){ return b.dj===x; })[0]||{}).fee||0))); },0))+'</b>. At this price the door takes about '+E.money(Math.min(fc,cap)*nt.price)+' on the door.</p>'+nightNote(G,nt)+splitNote(G,nt)+'<p>Expected demand: <b class="'+(fc>=cap?'good':fc<cap*0.6?'bad':'')+'">'+fc.toLocaleString()+'</b> for a room of '+cap.toLocaleString()+'. '+(fc>cap*1.25?'You could charge more.':fc<cap*0.6?'A bigger name, a lower price or more marketing would help.':'')+'</p>'+(nt.main?'':'<p>'+btn('Make this the main night','setmain','data-id="'+i+'"')+'</p>')); });
  return h; };

function djRow(d,mineV){ var avg=d.gigs?(d.sum/d.gigs).toFixed(1):'-';
  return '<tr><td>'+djName(d)+'</td><td>'+E.GENRES[d.g]+'</td><td class="n hi">'+d.draw+'</td><td class="n">'+abl(d)+'</td>'+(mineV?'<td class="n '+(d.cond<70?'bad':'')+'">'+Math.round(d.cond)+'%</td><td class="n">'+avg+'</td><td class="n">'+E.money(d.wage)+'</td><td class="n">'+d.until+'</td>':'<td class="n">'+d.age+'</td><td>'+esc(E.clubName(G,d.club))+'</td><td class="n">'+E.money(E.demand(G,d,true))+'</td>')+'</tr>'; }
S.djs=function(){ var m=E.mine(G).sort(function(a,b){ return b.draw-a.draw; }), bk=G.books.filter(function(b){ return b.w===G.week&&b.y===G.year; });
  return panel('Residents',m.length?tbl([['DJ'],['Sound'],['Draw','n'],['Abl','n'],['Fit','n'],['Avg','n'],['Per night','n'],['Until','n']],m.map(function(d){ return djRow(d,true); })):'<p class="dim">Nobody yet. The DJ market is open.</p>')+
    panel('Booked this week',bk.length?'<ul class="help">'+bk.map(function(b){ return '<li>'+esc(G.djs[b.dj].n)+' for '+E.money(b.fee)+'</li>'; }).join('')+'</ul>':'<p class="dim">No one-off bookings.</p>')+
    '<p class="dim small">Draw is fame: it pulls the crowd. Abl is how well they play: it makes the night. Fit drops with every gig and recovers with a week off. Stars play one night a week; smaller names will play two. A resident who headlines week after week goes stale and pulls a smaller crowd: rotate your headliners or bring in a guest.</p>'; };

S.market=function(){ var f=UI.mf, list=G.djs.filter(function(d){ if(d.club==='ME') return false; if(f.g&&d.g!==f.g) return false; if(f.st==='free'&&d.club!=='FA') return false; if(f.st==='res'&&d.club==='FA') return false; if(f.st==='new'&&(d.real||d.draw>6)) return false; if(f.st==='ok'&&!E.willing(G,d,true)) return false; if(f.st==='aff'&&(!E.willing(G,d,true)||E.demand(G,d,true)+E.buyout(G,d)/20>Math.max(1500,G.me.cap*5))) return false; return true; });
  var key={draw:function(d){ return -d.draw; },abil:function(d){ return -(d.known?d.abil:0); },fee:function(d){ return E.demand(G,d,true); },age:function(d){ return d.age; }}[f.sort]; list.sort(function(a,b){ return key(a)-key(b)||b.draw-a.draw; });

      tbl([['DJ'],['Sound'],['Draw','n'],['Abl','n'],['Age','n'],['Club'],['Asks','n']],list.slice(0,60).map(function(d){ return djRow(d,false); }))+'<p class="dim small">'+list.length+' found'+(list.length>60?', first 60 shown':'')+'. Tap a name to sign or book.</p>')+
    panel('Talent scout',(G.scout?'<p>Your scout is in '+G.scout.s+'. Back in '+G.scout.w+' week'+(G.scout.w>1?'s':'')+'.</p>':'<p>Send a scout to a scene for two weeks (€6,000). They come back with three unknowns and a view on how far each could go. They are not always right.</p><p class="row">'+E.SCENES.map(function(s){ return btn(s[0],'scout','data-id="'+s[0]+'"'); }).join('')+'</p>')); };

    panel('Staff',tbl([['Role'],['Skill','n'],['Weekly','n']],Object.keys(st).map(function(k){ return '<tr><td>'+st[k]+'</td><td class="n">'+stepper(me.staff[k],'staff',k)+'</td><td class="n">'+E.money(me.staff[k]*me.staff[k]*18)+'</td></tr>'; }))+'<p class="dim small">Better people cost more. Security stops fights, the bar manager lifts spend per head, the engineer keeps the sound alive.</p>')+
    panel('Dancers and bar','<p>Dancers '+stepper(me.dancers,'dancers','n')+' Troupe standard '+stepper(me.dq,'dancers','q',function(v){ return ['Students','Agency','Professional','Showgirls','World class'][v]; })+'</p><p>Average drink price '+stepper(me.drink,'drink','x',function(v){ return '€'+v; })+' <span class="dim">Higher prices earn more per drink and sell fewer.</span></p>')+
    panel('Expansion',tbl([['Venture'],['Cost','n'],['Weekly','n'],['','n']],Object.keys(E.VEN).map(function(k){ var v=E.VEN[k]; return '<tr><td><b>'+v[0]+'</b><br><span class="dim small">'+v[3]+'</span></td><td class="n">'+E.money(v[1]*1000)+'</td><td class="n good">'+E.money(v[2])+'</td><td class="n">'+(me.ven[k]?'Owned':btn('Buy','ven','data-id="'+k+'"'))+'</td></tr>'; }))); };

S.promo=function(){ var m=G.me.mk, ch={street:['Street team on the beaches',500],social:['Social media and influencers',500],bill:['Billboards on the airport road',1000],tour:['Tour-operator packages',1000]};
  return panel('Weekly marketing spend',tbl([['Channel'],['Spend','n']],Object.keys(ch).map(function(k){ return '<tr><td>'+ch[k][0]+'</td><td class="n">'+stepper(m[k],'mk',k,E.money)+'</td></tr>'; }))+'<p class="dim small">Each channel adds less the more you spend on it. Spread it around.</p>')+

S.under=function(){ var rel=function(v){ return v>=25?'Family':v>=10?'Friendly':v>-8?'Watching you':v>-25?'Unhappy':'At war'; };
  var arr=[]; if(G.prot) arr.push('<li>Protection to Los Halcones: '+E.money(G.prot)+' a week. '+btn('Stop paying','ustop','data-id="prot"')+'</li>'); if(G.wash) arr.push('<li>Washing '+E.money(G.wash)+' a week for '+E.FAM[G.washF||'hal'].n+'. '+btn('Stop','ustop','data-id="wash"')+'</li>'); if(G.deal) arr.push('<li>The Firm work your floor: '+E.money(G.deal)+' a week. '+btn('Throw them out','ustop','data-id="deal"')+'</li>');
  return '<div class="tiles"><div><span>Police heat</span><strong class="'+(G.heat>50?'bad':'')+'">'+Math.round(G.heat)+'</strong></div><div><span>Strikes</span><strong>'+G.strikes+' / 3</strong></div><div><span>Backers</span><strong class="sm">'+(G.conf>=70?'Happy':G.conf>=40?'Patient':'Restless')+'</strong></div></div><div class="bar"><div style="width:'+G.heat+'%"></div></div><p class="dim small">Heat fades a little every quiet week. Above 35 a raid becomes possible. Three strikes and Inspector Marí comes for you personally.</p>'+
    panel('The families',Object.keys(E.FAM).map(function(k){ var f=E.FAM[k]; return '<div class="card"><h3>'+f.n+' <i class="tag">'+rel(G.fam[k])+'</i></h3><p>'+f.boss+'. '+f.d+'</p><p class="dim small">'+famPerk(G,k)+'</p></div>'; }).join(''))+

S.island=function(){ var t=E.table(G);
  return panel('Island table '+G.year,tbl([['','n'],['Club'],['Area'],['Nights','n'],['Best','n'],['Pts','n']],t.map(function(r,i){ var rv=E.rival(r.id); return '<tr class="'+(r.id==='ME'?'me':'')+'"><td class="n">'+(i+1)+'</td><td>'+(r.id==='ME'?esc(r.n):'<a href="#" data-a="rv" data-id="'+r.id+'">'+esc(r.n)+'</a>')+'</td><td>'+E.AREAS[rv?rv[2]:G.me.area].n+'</td><td class="n">'+r.nights+'</td><td class="n">'+(r.best?r.best.toFixed(1):'-')+'</td><td class="n hi">'+r.pts+'</td></tr>'; }))+'<p class="dim small">Each week a club scores from its two best nights. Quality counts most: the rating is squared, a full room scores up to double a half-empty one, and size adds only a little. A brilliant small room can beat an average superclub. Calendar weeks such as the opening and closing parties count extra.</p>')+
    ownerPanel()+(G.hist.length?panel('History',tbl([['Season'],['Finished','n'],['Top club'],['Bank','n']],G.hist.map(function(h){ return '<tr><td>'+h.y+'</td><td class="n">'+h.pos+E.ordS(h.pos)+'</td><td>'+esc(h.champ)+'</td><td class="n">'+E.money(h.bank)+'</td></tr>'; }))):''); };

S.money=function(){ var L=G.led, nm={door:'Door',bar:'Bar',vip:'VIP tables',sponsors:'Sponsors',venues:'Other venues',prizes:'Prize money',underworld:'Off the books',loans:'Loans',djs:'DJ fees',staff:'Night staff and dancers',wages:'Management wages',rent:'Rent and running costs',marketing:'Marketing',buyouts:'Residency buy-outs',building:'Building and licences',repairs:'Repairs',legal:'Fines and lawyers',scouting:'Scouting',other:'Other'}, inc=0, out=0;

function nightScreen(){ var N=NT.N, all=NT.shown>=N.log.length, L=N.log.slice(0,Math.max(1,NT.shown)), last=L[L.length-1], ch=all?N.choice:null, done=N.done&&all;

function tick(){ if(!NT) return; NT.timer=null; var N=NT.N, d=NT.fast?350:1100;
  if(NT.shown<N.log.length){ NT.shown++; }
  else if(N.choice||N.done){ render(); return; }
  else { E.stepNight(G,N); if(NT.shown<N.log.length) NT.shown++; }
  var cur=N.log[NT.shown-1]; if(NT.shown<N.log.length) d=cur&&(cur.k==='build'||cur.k==='alert')?(NT.fast?700:2000):(NT.fast?300:900);
  render(); if((N.done||N.choice)&&NT.shown>=N.log.length) return; NT.timer=setTimeout(tick,d); }

  if(m.t==='rv'){ var r=E.rival(m.id), res=G.djs.filter(function(d){ return d.club===m.id; }).sort(function(a,b){ return b.draw-a.draw; });
    b='<h2>'+esc(r[1])+'</h2><p>'+E.AREAS[r[2]].n+' · capacity about '+r[3].toLocaleString()+' · '+r[5]+' nights a week · '+E.GENRES[r[6]]+(r[7]?' · owner: '+esc(r[7])+' <i class="tag">invented club</i>':(ownerLine(r[0])?' · '+esc(ownerLine(r[0])):''))+'</p>'+(res.length?tbl([['Resident'],['Sound'],['Draw','n']],res.map(function(d){ return '<tr><td>'+djName(d)+'</td><td>'+E.GENRES[d.g]+'</td><td class="n hi">'+d.draw+'</td></tr>'; })):'<p class="dim">No residents listed.</p>'); }
  return '<div class="veil" data-a="close"><div class="modal">'+b+'<p>'+btn('Close','close')+'</p></div></div>'; }
